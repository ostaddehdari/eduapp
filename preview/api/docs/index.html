<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eduapp API — Swagger</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
  <style>body{margin:0;background:#f7f9fc}.topbar{display:none}.swagger-ui .info{direction:rtl;text-align:right}.swagger-ui .scheme-container{direction:ltr}</style>
</head>
<body>
  <div id="swagger-ui"><p style="font:18px system-ui;padding:30px">در حال بارگذاری Swagger… اگر فایل‌های رابط بارگذاری نشدند، <a href="../openapi.json">OpenAPI JSON</a> را باز کنید.</p></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload=()=>SwaggerUIBundle({url:'../openapi.json',dom_id:'#swagger-ui',deepLinking:true,displayRequestDuration:true,filter:true,persistAuthorization:true,presets:[SwaggerUIBundle.presets.apis,SwaggerUIStandalonePreset],layout:'StandaloneLayout'});
  </script>
</body>
</html>
