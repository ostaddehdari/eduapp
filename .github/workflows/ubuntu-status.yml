name: Ubuntu status bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ops/request.json

permissions:
  contents: read

concurrency:
  group: ubuntu-status-bridge
  cancel-in-progress: false

jobs:
  server-status:
    name: Read-only Ubuntu status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout command request
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate allowlisted action
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          with open('ops/request.json', encoding='utf-8') as f:
              data = json.load(f)
          if set(data) != {'action', 'request_id'} or data['action'] != 'status':
              raise SystemExit('Request denied: only status action is allowed')
          if not isinstance(data['request_id'], str) or not data['request_id'].isdigit():
              raise SystemExit('Invalid request_id')
          print('Validated read-only status request', data['request_id'])
          PY

      - name: Connect to Ubuntu over pinned SSH
        shell: bash
        env:
          HOST: ${{ secrets.UBUNTU_SSH_HOST }}
          SSH_KEY: ${{ secrets.UBUNTU_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.UBUNTU_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$HOST" || -z "$SSH_KEY" || -z "$KNOWN_HOSTS" ]]; then
            echo "Missing GitHub Actions secrets: UBUNTU_SSH_HOST, UBUNTU_SSH_PRIVATE_KEY, UBUNTU_SSH_KNOWN_HOSTS" >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/eduapp_key"
          chmod 600 "$HOME/.ssh/eduapp_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -T \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=12 \
            -i "$HOME/.ssh/eduapp_key" \
            -p 2233 \
            "eduappbot@$HOST" status
