name: Ubuntu preview operations

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Allowed preview operation"
        required: true
        type: choice
        options:
          - status
          - inventory
          - logs
          - test
          - deploy-static
          - rollback
  push:
    branches: [main]
    paths:
      - ops/preview-request.json

permissions:
  contents: read

concurrency:
  group: eduapp-ubuntu-preview-operations
  cancel-in-progress: false

jobs:
  operation:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout request for push triggers
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate requested operation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == push ]]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('ops/preview-request.json').read_text(encoding='utf-8'))
          allowed = {'status','inventory','logs','test','deploy-static','rollback'}
          if set(data) != {'action','request_id'} or data.get('action') not in allowed:
              raise SystemExit('Denied operation request')
          if not isinstance(data['request_id'],str) or not data['request_id'].isdigit() or len(data['request_id'])>12:
              raise SystemExit('Invalid request ID')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('BRIDGE_ACTION='+data['action']+'\n')
          print('Validated requested operation:',data['action'],data['request_id'])
          PY
          else
            case "$DISPATCH_ACTION" in
              status|inventory|logs|test|deploy-static|rollback) ;;
              *) echo "Denied action" >&2; exit 2 ;;
            esac
            echo "BRIDGE_ACTION=$DISPATCH_ACTION" >> "$GITHUB_ENV"
          fi

      - name: Connect to bounded Ubuntu gateway
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          HOST: ${{ secrets.UBUNTU_SSH_HOST }}
          SSH_KEY: ${{ secrets.UBUNTU_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.UBUNTU_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$HOST" || -z "$SSH_KEY" || -z "$KNOWN_HOSTS" ]]; then
            echo "Missing SSH GitHub secrets" >&2
            exit 1
          fi
          case "$BRIDGE_ACTION" in
            status|inventory|logs|test|rollback) request="$BRIDGE_ACTION" ;;
            deploy-static)
              [[ "$REF" == "refs/heads/main" ]] || { echo "Deploy only allowed from main" >&2; exit 2; }
              [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
              request="deploy-static $COMMIT_SHA"
              ;;
            *) echo "Denied action" >&2; exit 2 ;;
          esac
          install -d -m 700 "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/eduapp_key"' EXIT
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/eduapp_key"
          chmod 600 "$HOME/.ssh/eduapp_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes -o ConnectTimeout=12 \
            -i "$HOME/.ssh/eduapp_key" -p 2233 \
            "eduappbot@$HOST" "$request"
