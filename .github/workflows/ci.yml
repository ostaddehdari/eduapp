name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  repository-policy:
    name: ci / repository-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Pin Corepack
        run: npm install --global --ignore-scripts corepack@0.36.0
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: corepack pnpm ci:policy
      - name: Validate Gateway v1 contract
        run: node scripts/validate-gateway-v1-contract.mjs
      - name: Validate PostgreSQL tenant contract
        run: node scripts/validate-postgres-tenant-contract.mjs
      - name: Verify executable Gateway and API compatibility
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/gateway-contract.mjs check "$PR_BASE_SHA"
          node --test apps/api-gateway/test/*.test.mjs
          node --import tsx --test tests/S02-W02/gateway-acceptance.test.mjs
          corepack pnpm --filter @eduapp/contracts lint
          corepack pnpm --filter @eduapp/contracts typecheck
          corepack pnpm --filter @eduapp/contracts test
          corepack pnpm --filter @eduapp/contracts build
      - run: node scripts/validate-stage-gate-s01.mjs

  runtime:
    name: ci / ${{ matrix.runtime }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [api, worker, public-web, control-panel]
    env:
      WORKSPACE_PACKAGE: '@eduapp/${{ matrix.runtime }}'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Pin Corepack
        run: npm install --global --ignore-scripts corepack@0.36.0
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: corepack pnpm --filter "$WORKSPACE_PACKAGE" lint
      - run: corepack pnpm --filter "$WORKSPACE_PACKAGE" typecheck
      - run: corepack pnpm --filter "$WORKSPACE_PACKAGE" test
      - run: corepack pnpm --filter "$WORKSPACE_PACKAGE" build

  dependency-boundaries:
    name: ci / dependency-boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Pin Corepack
        run: npm install --global --ignore-scripts corepack@0.36.0
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: node infra/ci/validate.mjs boundaries
      - name: Test Monorepo acceptance cases
        run: node --import tsx --test tests/S02-W01/monorepo-ci.test.mjs
