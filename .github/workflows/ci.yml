name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  repository-policy:
    name: ci / repository-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.12-bookworm
        env:
          POSTGRES_DB: eduapp_w03_test
          POSTGRES_USER: eduapp_ci
          POSTGRES_PASSWORD: eduapp_ci_only
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U eduapp_ci -d eduapp_w03_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      rabbitmq:
        image: rabbitmq:4.2.9
        env:
          RABBITMQ_DEFAULT_USER: eduapp_ci
          RABBITMQ_DEFAULT_PASS: eduapp_ci_only
        ports:
          - 127.0.0.1:55672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 18
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Pin Corepack
        run: npm install --global --ignore-scripts corepack@0.36.0
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: corepack pnpm ci:policy
      - name: Validate Gateway v1 contract
        run: node scripts/validate-gateway-v1-contract.mjs
      - name: Validate PostgreSQL tenant contract
        run: node scripts/validate-postgres-tenant-contract.mjs
      - name: Verify executable Gateway and API compatibility
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/gateway-contract.mjs check "$PR_BASE_SHA"
          node --test apps/api-gateway/test/*.test.mjs
          node --import tsx --test tests/S02-W02/gateway-acceptance.test.mjs
          corepack pnpm --filter @eduapp/contracts lint
          corepack pnpm --filter @eduapp/contracts typecheck
          corepack pnpm --filter @eduapp/contracts test
          corepack pnpm --filter @eduapp/contracts build
      - name: Test PostgreSQL tenant isolation
        env:
          EDUAPP_PG_ADMIN_URL: postgres://eduapp_ci:eduapp_ci_only@127.0.0.1:55432/eduapp_w03_test
        run: node --test tests/S02-W03/*.test.mjs
      - name: Test outbox delivery and broker recovery
        env:
          EDUAPP_TEST_AMQP_URL: amqp://eduapp_ci:eduapp_ci_only@127.0.0.1:55672
          EDUAPP_W04_PG_ADMIN_URL: postgres://eduapp_ci:eduapp_ci_only@127.0.0.1:55432/eduapp_w04_test
        run: node --test tests/S02-W04/*.test.mjs
      - name: Test development and staging observability
        run: node --test tests/S02-W05/*.test.mjs
      - name: Install Chromium for the interface acceptance test
        run: corepack pnpm exec playwright install --with-deps --only-shell chromium
      - name: Test the shared interface in both frontends
        run: |
          corepack pnpm --filter @eduapp/public-web build
          corepack pnpm --filter @eduapp/control-panel build
          node --test tests/S02-W06/*.test.mjs
      - run: node scripts/validate-stage-gate-s01.mjs
      - name: Validate the S02 evidence gate
        run: node scripts/validate-stage-gate-s02.mjs
      - name: Test authentication and session lifecycle
        env:
          EDUAPP_AUTH_PG_ADMIN_URL: postgres://eduapp_ci:eduapp_ci_only@127.0.0.1:55432/eduapp_s03_auth_test
        run: node --test tests/S03-W01/*.test.mjs
      - name: Test people and membership isolation
        env:
          EDUAPP_S03_W02_PG_ADMIN_URL: postgres://eduapp_ci:eduapp_ci_only@127.0.0.1:55432/eduapp_s03_w02_test
        run: node --test --test-concurrency=1 tests/S03-W02/*.test.mjs
      - name: Test roles, scope, relationships and field masking
        env:
          EDUAPP_S03_ACCESS_PG_ADMIN_URL: postgres://eduapp_ci:eduapp_ci_only@127.0.0.1:55432/eduapp_s03_access_test
        run: node --test --test-concurrency=1 tests/S03-W03/*.test.mjs
      - name: Test MFA, sensitive actions and bounded recovery
        env:
          EDUAPP_MFA_PG_ADMIN_URL: postgres://eduapp_ci:eduapp_ci_only@127.0.0.1:55432/eduapp_s03_mfa_test
        run: node --test --test-concurrency=1 tests/S03-W04/*.test.mjs
      - name: Test scoped security audit and redaction
        env:
          EDUAPP_S03_AUDIT_PG_ADMIN_URL: postgres://eduapp_ci:eduapp_ci_only@127.0.0.1:55432/eduapp_s03_audit_test
        run: node --test --test-concurrency=1 tests/S03-W05/*.test.mjs
      - name: Validate the S03 evidence gate
        run: node scripts/validate-stage-gate-s03.mjs
      - name: Validate the S04 evidence gate
        run: node scripts/validate-stage-gate-s04.mjs
      - name: Test tenant provisioning and organization tree isolation
        env:
          EDUAPP_S04_REGISTRY_PG_ADMIN_URL: postgres://eduapp_ci:eduapp_ci_only@127.0.0.1:55432/eduapp_s04_registry_test
          EDUAPP_S04_ORG_PG_ADMIN_URL: postgres://eduapp_ci:eduapp_ci_only@127.0.0.1:55432/eduapp_s04_org_test
        run: node --test --test-concurrency=1 tests/S04-W0[12]/*.test.mjs
      - name: Test resumable onboarding and scoped management
        env:
          EDUAPP_S04_REGISTRY_PG_ADMIN_URL: postgres://eduapp_ci:eduapp_ci_only@127.0.0.1:55432/eduapp_s04_registry_test
          EDUAPP_S04_SCOPE_PG_ADMIN_URL: postgres://eduapp_ci:eduapp_ci_only@127.0.0.1:55432/eduapp_s04_scope_test
        run: node --test --test-concurrency=1 tests/S04-W03/gateway-onboarding.test.mjs tests/S04-W04/*.test.mjs
      - name: Test custom fields and scoped two-person management approvals
        env:
          EDUAPP_S04_FIELDS_PG_ADMIN_URL: postgres://eduapp_ci:eduapp_ci_only@127.0.0.1:55432/eduapp_s04_fields_test
          EDUAPP_S04_MANAGEMENT_PG_ADMIN_URL: postgres://eduapp_ci:eduapp_ci_only@127.0.0.1:55432/eduapp_s04_management_test
          EDUAPP_S04_REGISTRY_PG_ADMIN_URL: postgres://eduapp_ci:eduapp_ci_only@127.0.0.1:55432/eduapp_s04_registry_test
        run: node --test --test-concurrency=1 tests/S04-W05/*.test.mjs tests/S04-W06/management*.test.mjs
      - name: Test immutable plan catalog and tenant-scoped quotes
        env:
          EDUAPP_S05_CATALOG_PG_ADMIN_URL: postgres://eduapp_ci:eduapp_ci_only@127.0.0.1:55432/eduapp_s05_catalog_test
        run: node --test --test-concurrency=1 tests/S05-W01/*.test.mjs
      - name: Test feature entitlement, separate permission and quota isolation
        env:
          EDUAPP_S05_ENTITLEMENT_PG_ADMIN_URL: postgres://eduapp_ci:eduapp_ci_only@127.0.0.1:55432/eduapp_s05_entitlement_test
        run: node --test --test-concurrency=1 tests/S05-W02/*.test.mjs
      - name: Test plan-selection summary and checkout invoice lifecycle
        env:
          EDUAPP_S05_CHECKOUT_PG_ADMIN_URL: postgres://eduapp_ci:eduapp_ci_only@127.0.0.1:55432/eduapp_s05_checkout_test
        run: |
          node --import tsx --test tests/S05-W03/*.test.ts
          node --test tests/S05-W03/browser.test.mjs
          node --test --test-concurrency=1 tests/S05-W04/*.test.mjs
      - name: Test the Persian control panel and verify the published preview bundle
        run: |
          node --test --test-concurrency=1 tests/S04-W03/browser.test.mjs tests/S04-W06/browser.test.mjs
          env -u VITE_EDUAPP_API_BASE corepack pnpm --filter @eduapp/control-panel exec vite build --base=./ --outDir ../../preview/panel --emptyOutDir
          cp packages/ui-tokens/node_modules/@fontsource-variable/vazirmatn/LICENSE preview/panel/Vazirmatn-LICENSE.txt
          test -z "$(git status --porcelain --untracked-files=all -- preview/panel)"

  runtime:
    name: ci / ${{ matrix.runtime }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [api, worker, public-web, control-panel]
    env:
      WORKSPACE_PACKAGE: '@eduapp/${{ matrix.runtime }}'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Pin Corepack
        run: npm install --global --ignore-scripts corepack@0.36.0
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: corepack pnpm --filter "$WORKSPACE_PACKAGE" lint
      - run: corepack pnpm --filter "$WORKSPACE_PACKAGE" typecheck
      - run: corepack pnpm --filter "$WORKSPACE_PACKAGE" test
      - run: corepack pnpm --filter "$WORKSPACE_PACKAGE" build

  dependency-boundaries:
    name: ci / dependency-boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Pin Corepack
        run: npm install --global --ignore-scripts corepack@0.36.0
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: node infra/ci/validate.mjs boundaries
      - name: Test Monorepo acceptance cases
        run: node --import tsx --test tests/S02-W01/monorepo-ci.test.mjs
